        </div>

        <div>
            <image src="slogo.png" width="40" />
        </div>

        <div class="col-start-2 row-start-2 flex flex-col gap-y-5">
            <p class="text-black text-5xl font-bold">BOOST YOUR SPEED</p>

            <p class="font-bold">Back<ion-icon name="reload"></ion-icon></p>

        <div class="col-start-3 row-start-3 flex gap-x-4 justify-center items-center">
            <p class="text-2xl">Color</p>
            <div class="w-[19] h-[19] bg-black rounded-full"></div>
            <div class="w-[19] h-[19] bg-blue-400 rounded-full"></div>
            <div class="w-[19] h-[19] bg-red-400 rounded-full"></div>
            <div class="w-[19] h-[19] bg-green-500 rounded-full"></div>
            <div class="w-[19] h-[19] bg-yellow-300 rounded-full"></div>
